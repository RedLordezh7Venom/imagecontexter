[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imagecontexter"
version = "0.2.0"
description = "Classify images into categories using SmolVLM GGUF on GPU. Fast, offline, zero cost."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "llama-cpp-python",
    "huggingface-hub",
    "Pillow",
    "PyYAML",
    "tqdm",
    "click",
]

[project.scripts]
imagecontexter = "imagecontexter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]