[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imagecontexter"
version = "0.3.0"
description = "Fast image classifier using RapidOCR and SmolVLM GGUF on GPU."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "llama-cpp-python",
    "rapidocr-onnxruntime",
    "huggingface-hub",
    "Pillow",
    "PyYAML",
    "tqdm",
    "click",
]

[project.scripts]
imagecontexter = "imagecontexter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]